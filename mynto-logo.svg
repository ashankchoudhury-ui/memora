<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Subtle violet glow behind bars -->
  <rect x="28" y="24" width="16" height="72" rx="8" fill="#8B5CF6" opacity="0.35" filter="url(#glow)"/>
  <rect x="76" y="24" width="16" height="72" rx="8" fill="#8B5CF6" opacity="0.35" filter="url(#glow)"/>
  
  <!-- Main bars -->
  <rect x="28" y="24" width="16" height="72" rx="8" fill="#8B5CF6"/>
  <rect x="76" y="24" width="16" height="72" rx="8" fill="#8B5CF6"/>
</svg>
