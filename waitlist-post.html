<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYNTO Post</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #08090a;
    --bg-surface: #0f1011;
    --bg-elevated: #191a1b;
    --text-primary: #f7f8f8;
    --text-secondary: #d0d6e0;
    --text-muted: #8a8f98;
    --accent: #7170ff;
    --accent-hover: #828fff;
    --border: rgba(255,255,255,0.08);
    --border-subtle: rgba(255,255,255,0.05);
  }
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  
  .post {
    width: 1080px;
    height: 1080px;
    background: var(--bg-deep);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 100px 120px;
    border: 1px solid var(--border-subtle);
  }
  
  /* Top accent line */
  .post::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent);
  }
  
  /* Typography system based on Linear */
  .eyebrow {
    font-size: 13px;
    font-weight: 510;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 80px;
    font-feature-settings: "cv01", "ss03";
  }
  
  .headline {
    font-size: 72px;
    font-weight: 510;
    line-height: 1.00;
    letter-spacing: -1.056px;
    color: var(--text-primary);
    margin-bottom: 48px;
    font-feature-settings: "cv01", "ss03";
  }
  
  .headline-accent {
    color: var(--accent);
  }
  
  .subhead {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.60;
    color: var(--text-muted);
    margin-bottom: 60px;
    letter-spacing: -0.165px;
    max-width: 720px;
  }
  
  .detail {
    font-size: 15px;
    font-weight: 510;
    line-height: 1.60;
    color: var(--text-secondary);
    letter-spacing: -0.165px;
    max-width: 640px;
  }
  
  /* Divider */
  .divider {
    width: 80px;
    height: 1px;
    background: var(--border);
    margin: 60px 0 32px;
  }
  
  /* CTA */
  .cta {
    font-size: 15px;
    font-weight: 510;
    color: var(--accent);
    letter-spacing: -0.01em;
  }
  
  .url {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    margin-top: 12px;
    letter-spacing: 0.02em;
  }
  
  /* Process steps */
  .process {
    display: flex;
    gap: 16px;
    margin-top: 80px;
  }
  
  .step {
    flex: 1;
    padding: 28px 24px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--border);
    border-radius: 8px;
    text-align: center;
  }
  
  .step-number {
    font-size: 11px;
    font-weight: 510;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 12px;
    font-feature-settings: "cv01", "ss03";
  }
  
  .step-label {
    font-size: 15px;
    font-weight: 510;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  
  /* Logo mark */
  .logo-mark {
    display: flex;
    gap: 10px;
    margin-bottom: 100px;
  }
  
  .logo-bar {
    width: 12px;
    height: 64px;
    background: var(--accent);
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="post">
    
        <div class="logo-mark">
          <div class="logo-bar"></div>
          <div class="logo-bar"></div>
        </div>
        <h1 class="headline">Join the<br>waitlist.</h1>
        <p class="subhead">Be first in line.</p>
        <div class="divider"></div>
        <div class="cta">↓ Check the bio</div>
        
        
  </div>
</body>
</html>
